# ivs-llm-chat — flagship chat (DeepSeek-V4-Flash, 4x GPU, TP4+EP)
# Reconstructed from live-process forensics (2026-10-28 cmdline/env capture, see raw/).
# Registry domain genericized. Exact flag spellings verifiable in raw/ivs-llm-chat.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivs-llm-chat
  labels:
    le: IVS-ETL-LLM-SERVICE        # platform label convention (two-level "le" required)
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }   # platform convention: single replica
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: vllm
        image: registry.internal/ivs-etl/vllm-docker:v0.25.1
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - --model=/data/models/DeepSeek-V4-Flash-0731     # NAS path; dir datestamp = version anchor
          - --served-model-name=deepseek-v4-flash-dspark,large-max-think,large-think,large
          - --tensor-parallel-size=4
          - --enable-expert-parallel
          - --max-model-len=196608
          - --max-num-seqs=32
          - --kv-cache-dtype=fp8
          - --block-size=256
          - --gpu-memory-utilization=0.9
          - --speculative-config={"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}
          - --tool-call-parser=deepseek_v4
          - --enable-auto-tool-choice
        env:
        - name: VLLM_ENGINE_READY_TIMEOUT_S    # cold-start tolerance for large weights
          value: "3600"
        ports:
        - { name: http, containerPort: 8000 }
        resources:
          limits: { nvidia.com/gpu: 4 }
        livenessProbe:                         # audit defect #1: no readiness/startup
          tcpSocket: { port: 8000 }
        volumeMounts:
        - { name: models,  mountPath: /data/models }   # NAS, weights separate from image
        - { name: dshm,    mountPath: /dev/shm }
      volumes:
      - name: models
        nfs: { server: <nas>, path: /models }          # genericized
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: 64Gi }
